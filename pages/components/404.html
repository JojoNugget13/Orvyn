<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Abyss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">

<body class="error-page">
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Lost in the Abyss</h1>
        <p class="error-message">
            The page you are looking for has been shrouded in darkness or 
            never existed in this timeline.
        </p>
        <div class="error-actions">
            <button class="return-btn" id="backToSanctuary">
                Return to Sanctuary
            </button>
        </div>
    </div>

    <!-- Thematic background elements -->
    <div class="moonlight-glow"></div>
    <div class="abyss-smoke"></div>
</body>
</html>
