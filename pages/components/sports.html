<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <section class="page-header">
            <button class="back-btn" onclick="navigateTo('../../index.html')">← Home</button>
            <h2>Sports</h2>

            <div class="search-container">
                <input type="text" id="globalSearch" placeholder="Search sports..." class="search-input">
            </div>
        </section>

        <section class="categories">
            <div class="category-grid">
                <!-- Football Category -->
                <div class="category-card" data-category="football" onclick="navigateTo('../sports/football.html')">
                    <div class="category-icon"><img src="../../../../images/icons/football.webp" alt="Football"></div>
                    <h4>Football</h4>
                    <p>The beautiful game. Players, clubs, and tournaments.</p>
                    <span class="item-count">0 clubs</span>
                </div>

                <!-- Add Category Placeholder -->
                <div class="category-card" data-category="custom">
                    <div class="category-icon"><img src="../../../../images/icons/plus.webp" alt="Coming Soon"></div>
                    <h4>Coming soon...</h4>
                    <p>...</p>
                    <span class="item-count">...</span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../../js/script.js"></script>
    <script src="../../js/components.js"></script>
</body>
</html>
