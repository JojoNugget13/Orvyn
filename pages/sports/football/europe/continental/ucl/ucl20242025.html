<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCL 24/25 Season</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../../../../css/style.css">
    <link rel="stylesheet" href="../../../../../../css/pages/wiki.css">
    <link rel="stylesheet" href="../../../../../../css/components/tabs.css">
    <link rel="stylesheet" href="../../../../../../css/components/standings.css">
    <link rel="stylesheet" href="../../../../../../css/components/matches.css">
    
    <link rel="stylesheet" href="../../../../../../css/components/brackets.css">
    <link rel="stylesheet" href="../../../../../../css/components/horizontal-scroll.css">
    <link rel="stylesheet" href="../../../../../../css/components/dropdowns.css">
    <!-- Main tabs (hero-tabs) are styled by css/components/tabs.css -->
    <!-- Player Stats sub-tabs are styled by css/components/player-stats.css, which is imported via style.css -->
    
    <script src="../../../../../../js/script.js" defer></script>
    <script src="../../../../../../js/components.js" defer></script>
    <script src="../../../../../../js/sports/football/europe/continental/ucl/ucl20242025/ucl20242025.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <section class="page-header">
            <button class="back-btn" onclick="navigateTo('../ucl.html')">← UCL</button>
            <h2>24/25 UEFA Champions League</h2>
            <p class="subtitle">Paris Saint-Germain's 1st UCL title</p>
        </section>

        <div class="hero-tabs">
            <button class="hero-tab-btn active" data-tab="matches">Matches</button>
            <button class="hero-tab-btn" data-tab="standings">Standings</button>
            <button class="hero-tab-btn" data-tab="player-stats">Player Stats</button>
            <button class="hero-tab-btn" data-tab="team-stats">Team Stats</button>
        </div>

        <div id="matches" class="tab-content active">
            <section class="wiki-section">
                <div class="section-header">
                    <h3>Matches</h3>
                    <label for="matchday-select" class="matchday-filter-label">View Matchday:</label>
                    <select id="matchday-select" class="matchday-filter-select"></select>
                </div>
                <div class="section-content" id="matches-container">
                    <p class="empty-state">League phase fixtures and knockout bracket results will be displayed here.</p>
                </div>
            </section>
        </div>

        <div id="standings" class="tab-content">
    <section class="wiki-section">
        <div class="section-header">
            <h3>Standings & Bracket</h3>
        </div>
        <div class="section-content">
            <div id="standings-container"></div>
        </div>
    </section>
</div>

        <div id="player-stats" class="tab-content">
            <section class="wiki-section">
                <div class="section-header">
                    <h3>Player Stats</h3>
                </div>
                <div class="section-content">
                    <div id="player-stats-container" class="player-stats-vertical-feed">
                        <p class="empty-state">Loading player data...</p>
                    </div>
                </div>
            </section>
        </div>

        <div id="team-stats" class="tab-content">
            <section class="wiki-section">
                <div class="section-header"><h3>Team Stats</h3></div>
                <div class="section-content" id="team-stats-container">
                    <p class="empty-state">Detailed team metrics, possession stats, and disciplinary records.</p>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // Universal Tab Logic
        const tabBtns = document.querySelectorAll('.hero-tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        function activateTab(tabName) {
            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            tabContents.forEach(content => {
                content.classList.toggle('active', content.id === tabName);
            });

            // Render Player Stats if tab is selected
            if (tabName === 'player-stats') {
                if (typeof window.renderPlayerStats === 'function') window.renderPlayerStats();
            }
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                activateTab(tab);
                localStorage.setItem('activeUclTab', tab);
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTab = localStorage.getItem('activeUclTab');
            if (savedTab) activateTab(savedTab);
        });
    </script>
</body>
</html>
